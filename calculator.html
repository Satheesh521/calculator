<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple_calculator</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" placeholder="0"value=""  readonly>
        <div class="buttons">
            <button type="button" onclick="clearDisplay()" id="c">C</button>
            <button type="button" onclick="appendToDisplay('7')" id="btn">7</button>
            <button type="button" onclick="appendToDisplay('8')" id="btn">8</button>
            <button type="button" onclick="appendToDisplay('9')" id="btn">9</button>
            <button type="button" onclick="appendToDisplay('4')" id="btn">4</button>
            <button type="button" onclick="appendToDisplay('5')" id="btn">5</button>
            <button type="button" onclick="appendToDisplay('6')" id="btn">6</button>
            <button type="button" onclick="appendToDisplay('1')" id="btn">1</button>
            <button type="button" onclick="appendToDisplay('2')" id="btn">2</button>
            
            <button type="button" onclick="appendToDisplay('3')" id="btn">3</button>
            <button type="button" onclick="appendToDisplay('0')" id="btn">0</button>
            <button type="button" onclick="appendToDisplay('+')" id="btn">+</button>
            <button type="button" onclick="appendToDisplay('-')" id="btn">-</button>
            <button type="button" onclick="appendToDisplay('*')" id="btn">*</button>
            <button type="button" onclick="appendToDisplay('/')" id="btn">/</button>
            <button type="button" onclick="calculateResult('=')"id="sum">=</button>
            <button type="button" onclick="deleteLast()"class="del">Delete</button>

        </div>
    </div>
    <h4>Create By Satheesh kannan</h4>
    <script>
        const display = document.getElementById("display");
            
        function appendToDisplay(value) {
            display.value += value;
        }
    
        function clearDisplay() {
            display.value = "";
        }
    
        function calculateResult() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = "Error";
            }
        }
    
        function toggleDarkMode() {
            const body = document.body;
            body.classList.toggle("dark-mode");
        }v 
        function deleteLast() {
      const inputField = document.getElementById("display");
      const currentValue = inputField.value;
      
      // Remove the last character
      inputField.value = currentValue.slice(0, -1);
    }
      
     
    </script>

</body>
</html>
